name: Build and Release espDisplay Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run project checks
        run: python tools/check_project.py

      - name: Validate tag and firmware version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^#define FW_VERSION "\([^"]*\)"/\1/p' src/version.h)"
          if [[ -z "$VERSION" ]]; then
            echo "FW_VERSION not found in src/version.h" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match FW_VERSION $VERSION" >&2
            exit 1
          fi

      - name: Build ESP8266 firmware
        run: pio run -e d1_mini

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -s .pio/build/d1_mini/firmware.bin
          cp .pio/build/d1_mini/firmware.bin firmware.bin
          sha256sum firmware.bin > firmware.bin.sha256

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 --clobber
          elif [[ -f "$NOTES_FILE" ]]; then
            gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 \
              --verify-tag \
              --title "espDisplay $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 \
              --verify-tag \
              --title "espDisplay $GITHUB_REF_NAME" \
              --generate-notes
          fi
