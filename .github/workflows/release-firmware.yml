name: Build and Release espDisplay Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Run project checks
        run: python tools/check_project.py

      - name: Validate tag and firmware version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^#define FW_VERSION "\([^"]*\)"/\1/p' src/version.h)"
          if [[ -z "$VERSION" ]]; then
            echo "FW_VERSION not found in src/version.h" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match FW_VERSION $VERSION" >&2
            exit 1
          fi

      - name: Build ESP8266 firmware
        run: pio run -e d1_mini

      - name: Prepare release and OTA assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -s .pio/build/d1_mini/firmware.bin
          cp .pio/build/d1_mini/firmware.bin firmware.bin
          sha256sum firmware.bin > firmware.bin.sha256

          SIZE="$(stat -c%s firmware.bin)"
          SHA256="$(sha256sum firmware.bin | awk '{print $1}')"
          cat > manifest.json <<JSON
          {
            "version": "$GITHUB_REF_NAME",
            "firmware": "firmware.bin",
            "size": $SIZE,
            "sha256": "$SHA256"
          }
          JSON

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert data['version'].startswith('v')
          assert data['firmware'] == 'firmware.bin'
          assert isinstance(data['size'], int) and data['size'] > 0
          assert len(data['sha256']) == 64
          print(json.dumps(data, indent=2))
          PY

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="RELEASE_NOTES.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 --clobber
          elif [[ -f "$NOTES_FILE" ]]; then
            gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 \
              --verify-tag \
              --title "espDisplay $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sha256 \
              --verify-tag \
              --title "espDisplay $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Publish redirect-free OTA channel
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OTA_WORKTREE="${RUNNER_TEMP}/espdisplay-ota"
          rm -rf "$OTA_WORKTREE"
          git fetch origin ota || true

          if git show-ref --verify --quiet refs/remotes/origin/ota; then
            git worktree add -B ota "$OTA_WORKTREE" origin/ota
          else
            git worktree add --detach "$OTA_WORKTREE"
            (
              cd "$OTA_WORKTREE"
              git switch --orphan ota
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          (
            cd "$OTA_WORKTREE"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp "$GITHUB_WORKSPACE/firmware.bin" firmware.bin
            cp "$GITHUB_WORKSPACE/firmware.bin.sha256" firmware.bin.sha256
            cp "$GITHUB_WORKSPACE/manifest.json" manifest.json
            cat > README.md <<'TXT'
          # espDisplay OTA channel

          This branch is generated automatically by GitHub Actions.

          Files used by ESP8266 OTA clients:

          - `manifest.json`
          - `firmware.bin`
          - `firmware.bin.sha256`

          Do not edit this branch manually.
          TXT

            git add firmware.bin firmware.bin.sha256 manifest.json README.md
            if git diff --cached --quiet; then
              echo "OTA channel already contains these exact artifacts."
            else
              git commit -m "Publish OTA ${GITHUB_REF_NAME}"
            fi
            git push origin HEAD:ota
          )
